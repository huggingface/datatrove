# https://github.com/huggingface/datatrove/pull/159
name: PyPI release
on:
  workflow_dispatch:

jobs:
  testing:
    uses: ./.github/workflows/testing.yml
  release:
    needs: testing
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to create a tag
      id-token: write  # needed for PyPI trusted publishing (OIDC)

    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U build

      - name: Build the dist files
        run: python -m build .

      - name: Test installing the built wheel and running tests
        run: |
          python -m pip install uv
          uv pip install --system "$(ls dist/*.whl)[testing]"
          python -m nltk.downloader punkt
          python -m pytest -sv ./tests/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          verbose: true
          print-hash: true

      - name: Get tag name
        id: get_tag_name
        run: |
          echo TAG_NAME=$(grep '^version' pyproject.toml | head -1 | cut -d '"' -f 2) >> $GITHUB_OUTPUT

      - name: Tag the release
        # runs after the publish so a failed upload doesn't leave a tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ steps.get_tag_name.outputs.TAG_NAME }}',
              sha: context.sha
            })
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # needed to tag
