# https://github.com/huggingface/datatrove/pull/159
name: PyPI release
on:
  workflow_dispatch:

jobs:
  testing:
    uses: ./.github/workflows/testing.yml
  release:
    needs: testing
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to create a tag
      id-token: write  # needed for PyPI trusted publishing (OIDC)

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U build

      - name: Build the dist files
        run: python -m build .

      - name: Test installing the built wheel and running tests
        run: |
          python -m pip install uv
          uv pip install --system "$(ls dist/*.whl)[testing]"
          python -m nltk.downloader punkt
          python -m pytest -sv ./tests/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          verbose: true
          print-hash: true

      - name: Get tag name
        id: get_tag_name
        run: |
          echo TAG_NAME=$(grep '^version' pyproject.toml | head -1 | cut -d '"' -f 2) >> $GITHUB_OUTPUT

      - name: Tag the release
        # runs after the publish so a failed upload doesn't leave a tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ steps.get_tag_name.outputs.TAG_NAME }}',
              sha: context.sha
            })
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # needed to tag
