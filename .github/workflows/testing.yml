name: Test & Check Code Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

permissions: {}

jobs:
  check_code_quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --extra quality
      - name: Check quality
        run: |
          uv run ruff check tests src examples # linter
          uv run ruff format --check tests src examples # formatter

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --extra testing
          .venv/bin/python -m nltk.downloader punkt
      - name: Test with pytest
        env:
          PYTHONFAULTHANDLER: 1
        run: |
          # Avoid `uv run` here: Ray workers inherit the launcher and try to recreate
          # an env from project metadata, which drops the testing extras and breaks imports.
          .venv/bin/python -m pytest -sv ./tests/
