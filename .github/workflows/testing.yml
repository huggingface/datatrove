name: Test & Check Code Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

permissions: {}

jobs:
  check_code_quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --extra quality
      - name: Check quality
        run: |
          uv run ruff check tests src examples # linter
          uv run ruff format --check tests src examples # formatter

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install uv
          # Install the locked `testing` environment without the GPU stack (~4.5 GB of wheels per job).
          # No test on these CPU runners uses vllm, sglang or bitsandbytes, and torch only runs on CPU here.
          # `--prune` also drops dependencies that only these packages need (e.g. openai, which only the
          # remote-endpoint path of EndpointServer imports; no test covers that path yet).
          # --locked fails if uv.lock is out of date with pyproject.toml.
          uv export --locked --extra testing --no-hashes \
            --prune vllm --prune sglang --prune bitsandbytes --prune torch \
            -o requirements-ci.txt
          TORCH_VERSION=$(uv export --locked --extra testing --no-hashes | grep -oP '^torch==\K[^ ;]+')
          uv venv
          # --no-deps: the export is already the full locked set, so nothing is re-resolved from PyPI
          uv pip install --no-deps -r requirements-ci.txt
          uv pip install --no-deps "torch==${TORCH_VERSION}" --torch-backend cpu
          # fail here, not in a random test, if the pruned install is missing a dependency
          uv pip check
          .venv/bin/python -m nltk.downloader punkt
      - name: Test with pytest
        env:
          PYTHONFAULTHANDLER: 1
        run: |
          # Avoid `uv run` here: Ray workers inherit the launcher and try to recreate
          # an env from project metadata, which drops the testing extras and breaks imports.
          .venv/bin/python -m pytest -sv ./tests/
